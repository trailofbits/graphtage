on:
  release:
    types:
      - published

name: release

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # A stale graphtage/version.py would build graphtage-<old version>.tar.gz, which PyPI
      # rejects as an existing filename, after the release is already public.
      - name: Check that the release tag matches graphtage/version.py
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python graphtage/version.py)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match graphtage/version.py ($VERSION)" >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish Python distributions to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphtage
    needs: [build]
    permissions:
      # Used to publish to PyPI with Trusted Publishing, and to sign each distribution with a
      # PEP 740 attestation, which pypa/gh-action-pypi-publish generates by default.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2


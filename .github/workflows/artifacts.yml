name: Build binary artifacts

on:
  push:
    tags:
      - "v*"
  # Lets the binary build be exercised on a branch, without uploading anything.
  workflow_dispatch:

permissions: {}

jobs:
  binaries:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ] # windows-latest,

    runs-on: ${{ matrix.os }}

    permissions:
      # NOTE: Needed to upload the binaries to the release.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than 3.x so a given tag always builds against the same interpreter.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The archive name comes from graphtage/version.py, so a tag that disagrees with it would
      # produce a mislabeled binary. Fail here, while the release is still a draft.
      - name: Check that the tag matches graphtage/version.py
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python graphtage/version.py)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match graphtage/version.py ($VERSION)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build the binary
        run: |
          make -C bindist
          # GNU make writes "Entering directory" to stdout with -C, and it would land inside the
          # captured archive name.
          echo "DIST_FILE=$(make --no-print-directory -C bindist dist-name)" >> "$GITHUB_ENV"

      # A frozen binary runs without the site module, and it bundles only the imports PyInstaller
      # can find, so it can fail where the interpreter does not. Diff something rather than only
      # asking for the version.
      - name: Check that the binary runs
        run: |
          bindist/dist/graphtage --version
          printf '{"a": 1, "b": [2, 3]}' > "$RUNNER_TEMP/from.json"
          printf '{"a": 1, "b": [2, 4]}' > "$RUNNER_TEMP/to.json"
          exit_status=0
          bindist/dist/graphtage --no-status --format yaml \
            "$RUNNER_TEMP/from.json" "$RUNNER_TEMP/to.json" || exit_status=$?
          if [ "$exit_status" -ne 1 ]; then
            echo "Expected exit status 1 (differences found), got $exit_status" >&2
            exit 1
          fi

      # `gh release upload` can only add assets to a release that already exists, so a stray tag
      # cannot publish a release of its own. It uploads to a draft just as well as to a published
      # release.
      - name: Upload the binary to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "bindist/$DIST_FILE" --clobber

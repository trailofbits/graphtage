name: Build binary artifacts

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  binaries:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ] # windows-latest,

    runs-on: ${{ matrix.os }}

    permissions:
      # NOTE: Needed to save artifacts the repository.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than 3.x so a given tag always builds against the same interpreter.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build the binary
        run: |
          make -C bindist
          echo "DIST_FILE=$(make -C bindist dist-name | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Check that the binary runs
        run: bindist/dist/graphtage --version

      - name: Release binary artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: bindist/${{ env.DIST_FILE }}
